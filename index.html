<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Włoski B1–B2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and plain, built for an e-ink tablet (BOOX) first, phone second
   IDEA a printed Italian exercise book: black ink on white paper, one red pencil for corrections
   PICTURE the working card itself: one exercise per screen, big type, big answer targets
   COLOUR white paper, black ink, red pencil #b3161b for errors and marks; inverted black buttons for selection (reads well on e-ink)
   TYPE Literata (made for e-reading) for everything, weights 400/600/800
   LAYOUT one centred column up to 880px, nav that wraps, no animation, no scroll-heavy lists in practice */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#111111);--ink:light-dark(#000000,#f2f2f2);--mut:light-dark(#3d3d3d,#c4c4c4);--line:light-dark(#000000,#e6e6e6);--soft:light-dark(#eeeeee,#262626);--red:light-dark(#b3161b,#ff7a7a)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Literata,Georgia,"Times New Roman",serif;overflow-x:clip}
.wrap{max-width:880px;margin:0 auto;padding:0 max(16px,4vw)}
header{border-bottom:3px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-top:14px}
.brand{font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.status{font-size:14px;color:var(--mut)}
nav{display:flex;flex-wrap:wrap;gap:0 2px;margin-top:8px}
nav a{color:var(--ink);text-decoration:none;font-weight:600;padding:10px 12px;min-height:48px;display:flex;align-items:center;border:2px solid transparent;border-bottom:0}
nav a.on{border-color:var(--line);background:var(--bg);margin-bottom:-3px;border-bottom:3px solid var(--bg)}
main{padding:20px 0 60px}
h1{font-size:clamp(30px,5vw,40px);font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:6px 0 12px}
h2{font-size:25px;font-weight:800;line-height:1.15;margin:30px 0 10px;padding-top:12px;border-top:2px solid var(--line)}
h3{font-size:20px;font-weight:800;margin:20px 0 6px}
p{margin:.4em 0 .8em;max-width:68ch}
.mut{color:var(--mut)}
.small{font-size:15px}
.red{color:var(--red)}
a{color:var(--ink)}
.btn{font:inherit;font-weight:600;font-size:17px;min-height:52px;padding:10px 18px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:center}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:44px;font-size:15px;padding:6px 12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,nav a:focus-visible,.opt:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.tile{border:2px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:120px}
.tile b{font-size:21px;line-height:1.2}
.tile .big{font-size:44px;font-weight:800;line-height:1}
.box{border:2px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.box.dash{border-style:dashed}
label{font-weight:600}
input[type=text],input:not([type]),textarea,select{font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:10px 12px;min-height:52px;width:100%}
textarea{min-height:150px;resize:vertical;line-height:1.45}
.fld{display:grid;gap:4px;margin:10px 0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 14px}
.chk{font:inherit;color:inherit;background:var(--bg);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 8px;border:2px solid var(--line);border-radius:22px;cursor:pointer;font-weight:600;font-size:16px;user-select:none}
.chk input{width:22px;height:22px;accent-color:#000;margin:0}
.chk.on{background:var(--ink);color:var(--bg)}
.chk.on .mut{color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
table{border-collapse:collapse;width:100%;font-size:16px;margin:8px 0 14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:800}
.scroll{overflow-x:auto}
ul{padding-left:1.2em}
/* karta ćwiczenia */
.card{border:3px solid var(--line);border-radius:12px;padding:clamp(16px,3vw,28px);margin:8px 0 14px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--mut);margin-bottom:10px}
.prog{height:10px;border:2px solid var(--line);border-radius:6px;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--ink)}
.q{font-size:clamp(21px,3.2vw,26px);line-height:1.35;margin:0 0 18px}
.q .w{font-weight:800}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:19px;text-align:left;min-height:56px;padding:10px 16px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt.sel{background:var(--ink);color:var(--bg)}
.opt.ok{border-width:4px;font-weight:800}
.opt.ok::before{content:"✓ "}
.opt.bad{text-decoration:line-through;color:var(--red);border-color:var(--red)}
.opt.bad::before{content:"✗ "}
input.ans{font-size:22px;font-weight:600;min-height:58px;display:inline-block;width:min(100%,16em);margin:2px 0}
input.ans.ok{border-width:4px}
input.ans.bad{border-color:var(--red);color:var(--red)}
.fb{margin-top:16px;padding-top:14px;border-top:2px dashed var(--line);font-size:18px}
.fb:empty{display:none}
.verdict{font-weight:800;font-size:22px}
.verdict.bad{color:var(--red)}
.answer{font-size:24px;font-weight:800;margin:4px 0}
.flash{text-align:center;padding:20px 0}
.flash .w{font-size:clamp(34px,7vw,52px);font-weight:800;line-height:1.1}
.letters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.letters .opt{min-width:52px;text-align:center;font-weight:800;font-size:22px}
.built{min-height:58px;border:2px dashed var(--line);border-radius:10px;padding:8px 14px;font-size:26px;font-weight:800;letter-spacing:.06em}
.tbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.tbl .box{margin:0}
.tbl h3{margin:0 0 4px;font-size:17px}
.tbl td{border:0;padding:1px 6px 1px 0;font-size:16px}
.wl .it{font-weight:800}
.wl td:last-child{white-space:nowrap;text-align:right}
.chat{display:grid;gap:10px;margin:12px 0}
.msg{border:2px solid var(--line);border-radius:10px;padding:10px 14px;max-width:92%}
.msg.me{justify-self:end;background:var(--soft)}
.msg .tr{font-size:15px;color:var(--mut);margin-top:4px}
.msg .fix{font-size:15px;color:var(--red);margin-top:6px;border-top:1px dashed var(--red);padding-top:4px}
.theory{font-size:17px}
.theory table{font-size:15.5px;display:block;overflow-x:auto}
.hide{display:none!important}
.note{border-left:4px solid var(--red);padding:6px 12px;margin:10px 0}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}
.lvl{display:inline-block;border:1.5px solid var(--line);border-radius:4px;padding:0 6px;font-size:13px;font-weight:600;margin-left:6px;vertical-align:middle}
.wheelbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:center}
.wheel{width:100%;max-width:420px;display:block;margin:0 auto}
.dice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
.dice div{border:2px solid var(--line);border-radius:10px;padding:8px;text-align:center;display:grid;gap:2px}
.dice span{font-size:13px}
.dice b{font-size:18px;overflow-wrap:anywhere}
@media(max-width:700px){.wheelbox{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){#wg{transition:none!important}}
.key{font-size:.8em;color:var(--mut);font-weight:400}
.opt.sel .key{color:inherit}
@media(max-width:600px){body{font-size:17px}nav a{padding:8px 9px;font-size:16px}.brand{font-size:25px}table{font-size:14px}}
@media(max-width:480px){.hrow{padding-top:8px}.brand{font-size:22px}.status{font-size:12px}nav{flex-wrap:nowrap;overflow-x:auto;margin-top:4px}nav a{flex:none;min-height:44px;padding:6px 9px;font-size:15px}main{padding:12px 0 40px}h1{font-size:28px}h2{font-size:22px;margin-top:22px}.card{padding:14px;border-width:2px}.q{font-size:20px;margin-bottom:12px}.opt{font-size:17px;min-height:48px;padding:8px 12px}.btn{min-height:46px;padding:8px 14px;font-size:16px}input.ans{font-size:20px;min-height:50px}.tile{min-height:0;padding:12px}.tile .big{font-size:32px}.tile b{font-size:18px}.flash .w{font-size:34px}.meta{margin-bottom:6px}.prog{margin-bottom:10px}}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="hrow"><div class="brand">Włoski B1–B2</div><div class="status" id="status">Wczytuję…</div></div>
 <nav id="nav">
  <a href="#start" data-v="start">Start</a>
  <a href="#slowka" data-v="slowka">Słówka</a>
  <a href="#gry" data-v="gry">Gry</a>
  <a href="#gramatyka" data-v="gramatyka">Gramatyka</a>
  <a href="#odmiana" data-v="odmiana">Odmiana</a>
  <a href="#panda" data-v="panda">Panda i podróż</a>
  <a href="#postep" data-v="postep">Postęp</a>
 </nav>
</div></header>
<main class="wrap" id="view"></main>

M("„Poznałem go w Mediolanie.”", ["L'ho conosciuto a Milano.", "Lo conoscevo a Milano."], 0, "Conoscere w passato prossimo = poznać.")]},

{ id: "aux", l: "B1", n: "Avere o essere?", pl: "Posiłkowy i uzgadnianie imiesłowu",
th: `<p><b>Essere</b> biorą: czasowniki ruchu z kierunkiem (andare, venire, arrivare, partire, uscire, entrare, tornare), zmiany stanu (nascere, morire, diventare, crescere), pozostawania (stare, restare, rimanere), <b>piacere, sembrare, costare, durare, succedere, riuscire</b> i <b>wszystkie zwrotne</b> (mi sono alzato).</p>
<p><b>Avere</b>: większość pozostałych, zwłaszcza z dopełnieniem (ho comprato una macchina).</p>
<p><b>Uzgadnianie:</b> z essere imiesłów zgadza się z podmiotem: <i>Anna è partit<b>a</b>, siamo arrivat<b>i</b></i>. Z avere nie — chyba że przed nim stoi zaimek lo/la/li/le/ne: <i>La macchina? L'ho vist<b>a</b>. Le chiavi? Le ho pres<b>e</b>. Di Panda ne ho vist<b>e</b> tre.</i></p>
<p><b>Oba posiłkowe:</b> cominciare, finire, salire, scendere, passare, correre — z dopełnieniem avere (ho finito il lavoro), bez dopełnienia essere (il film è finito).</p>`,
ex: [
F("Ieri Giulia (partire) ___ per Torino.", "è partita", ""),
F("Noi (mangiare) ___ una pizza.", "abbiamo mangiato", ""),
F("Mi (piacere) ___ molto la Panda rossa.", "è piaciuta", "Piacere + essere; zgadza się z „la Panda”."),
F("Quanto (costare) ___ la riparazione?", "è costata", ""),
F("I miei amici (arrivare) ___ tardi.", "sono arrivati", ""),
F("Stamattina io (alzarsi, mężczyzna) ___ alle sette.", "mi sono alzato", ""),
F("La lettera? L'ho (leggere) ___ ieri.", "letta", "Zaimek la przed avere → uzgadniamy."),
F("Le chiavi? Le ho (dare) ___ al venditore.", "date", ""),
M("Il film ___ alle undici.", ["ha finito", "è finito"], 1, "Bez dopełnienia → essere."),
M("Ho ___ il lavoro alle sei.", ["finito", "finita"], 0, "Avere bez zaimka → bez uzgadniania."),
M("Il prezzo ___ di 200 euro.", ["è salito", "ha salito"], 0, "Salire bez dopełnienia → essere."),
M("Quante Panda hai visto? ___ tre.", ["Ne ho viste", "Ne ho visto"], 0, "Przy ne uzgadniamy z rzeczownikiem (le Panda → viste).")]},

{ id: "trapassato", l: "B1", n: "Trapassato prossimo", pl: "Zaprzeszły",
th: `<p>Czynność <b>wcześniejsza od innej czynności w przeszłości</b>. Polski nie ma takiego czasu — dodaj w głowie „już wcześniej”.</p>
<p>Budowa: <b>imperfetto od avere/essere + imiesłów</b>: avevo comprato, ero partito/a.</p>
<p><i>Quando sono arrivato, il treno <b>era</b> già <b>partito</b>.</i> — Kiedy przyjechałem, pociąg już odjechał.<br><i>Ha venduto la Panda che <b>aveva comprato</b> nel 1990.</i></p>
<p>Typowe słowa: già, prima, ormai, non… ancora.</p>`,
ex: [
F("Quando sono arrivato, il venditore (vendere) ___ già la macchina.", "aveva venduto", ""),
F("Non sapevo che tu (partire, kobieta) ___ .", "eri partita", ""),
F("Ero stanco perché non (dormire) ___ .", "avevo dormito", ""),
F("Gli ho restituito il libro che mi (prestare) ___ .", "aveva prestato", ""),
F("Quando ci siamo incontrati, noi (finire) ___ già di mangiare.", "avevamo finito", ""),
F("Lei mi ha detto che (essere) ___ in Italia due volte.", "era stata", ""),
M("Quando siamo arrivati al cinema, il film ___ .", ["era già cominciato", "cominciava già", "è già cominciato"], 0, ""),
M("Ho capito che mi ___ una bugia.", ["avevi detto", "dicevi", "hai detto"], 0, "Kłamstwo było wcześniej niż zrozumienie."),
M("„Nigdy wcześniej nie widziałem takiej Pandy.”", ["Non avevo mai visto una Panda così.", "Non vedevo mai una Panda così."], 0, ""),
F("Ha detto che (perdere) ___ il passaporto.", "aveva perso|aveva perduto", "")]},

{ id: "futuro", l: "B1", n: "Futuro semplice e anteriore", pl: "Czas przyszły",
th: `<p><b>Futuro semplice</b>: parler<b>ò</b>, prender<b>ò</b>, dormir<b>ò</b>. Końcówki: -ò, -ai, -à, -emo, -ete, -anno.</p>
<p>Nieregularne tematy: sarò, avrò, andrò, verrò, farò, dirò, potrò, vorrò, dovrò, saprò, vedrò, vivrò, berrò, terrò, rimarrò. Pisownia: cercherò, pagherò, mangerò, comincerò.</p>
<p><b>Futuro anteriore</b> (avrò fatto, sarò arrivato) — coś będzie <b>już zakończone</b> przed inną przyszłą czynnością: <i>Quando <b>avrò finito</b>, ti chiamerò.</i> — Kiedy skończę, zadzwonię.</p>
<p><b>Przypuszczenie:</b> futuro wyraża domysł o teraźniejszości: <i>Dov'è Marco? — <b>Sarà</b> a casa.</i> (pewnie jest w domu). Futuro anteriore — domysł o przeszłości: <i><b>Avrà perso</b> il treno.</i> (pewnie spóźnił się na pociąg).</p>`,
ex: [
F("L'anno prossimo io (comprare) ___ una Panda.", "comprerò", ""),
F("Domani noi (andare) ___ a vedere la macchina.", "andremo", "Jedno m!"),
F("Quanto (costare) ___ il passaggio di proprietà?", "costerà", ""),
F("Ti (pagare, io) ___ con un bonifico.", "pagherò", ""),
F("Quando (arrivare, tu) ___ a Milano, chiamami.", "arriverai|sarai arrivato|sarai arrivata", "Po quando włoski używa futuro."),
F("Dopo che (vedere, io) ___ la macchina, deciderò.", "avrò visto|avrò veduto", "Futuro anteriore: najpierw obejrzę."),
F("Non risponde. (dormire) ___ .", "dormirà", "Domysł: pewnie śpi."),
F("Il venditore non è venuto. (dimenticare) ___ l'appuntamento.", "avrà dimenticato", "Domysł o przeszłości."),
M("Che ore sono? — Non so, ___ le tre.", ["saranno", "sono state", "sarebbero"], 0, "Domysł o teraz."),
M("Quando ___ i soldi, comprerò la macchina.", ["avrò risparmiato", "risparmierei", "ho risparmiato"], 0, ""),
F("Noi (venire) ___ a trovarvi a maggio.", "verremo", ""),
F("Io non (potere) ___ venire domani.", "potrò", "")]},

{ id: "condiz", l: "B1", n: "Condizionale presente e passato", pl: "Tryb przypuszczający",
th: `<p><b>Condizionale presente</b> (parlerei, vorrei, potrei) — prośby, uprzejmość, rady, życzenia: <i><b>Vorrei</b> vedere la macchina. <b>Potrebbe</b> abbassare il prezzo? Al tuo posto <b>controllerei</b> il motore.</i></p>
<p>Końcówki: -ei, -esti, -ebbe, -emmo, -este, -ebbero (ten sam temat co futuro: sarei, avrei, andrei, verrei).</p>
<p><b>Condizionale passato</b> (avrei fatto, sarei venuto) — niezrealizowane w przeszłości: <i><b>Avrei comprato</b> la Panda, ma era troppo cara.</i> — Kupiłbym, ale była za droga.</p>
<p><b>Przyszłość w przeszłości</b> — tu Polacy się mylą! Po „ha detto che / pensavo che / sapevo che” o czymś późniejszym: <b>condizionale passato</b>. <i>Ha detto che <b>sarebbe venuto</b>.</i> — Powiedział, że przyjdzie (nie: „verrebbe”).</p>
<p>Także informacja niepotwierdzona (w gazetach): <i>Il venditore <b>avrebbe</b> già tre offerte.</i> — Sprzedawca podobno ma już trzy oferty.</p>`,
ex: [
F("(volere, io) ___ un caffè, per favore.", "vorrei", ""),
F("(potere, Lei) ___ ripetere più lentamente?", "potrebbe", "Forma grzecznościowa = 3. os."),
F("Al tuo posto io (controllare) ___ la ruggine.", "controllerei", ""),
F("Sarebbe meglio se noi (vedere) ___ la macchina di giorno.", "vedessimo", "Po se → congiuntivo imperfetto, nigdy condizionale."),
F("Ha detto che mi (chiamare) ___ il giorno dopo.", "avrebbe chiamato", "Przyszłość w przeszłości → condizionale passato."),
F("Pensavo che il treno (arrivare) ___ in orario.", "sarebbe arrivato", ""),
F("Ieri (uscire, io) ___ volentieri, ma pioveva.", "sarei uscito|sarei uscita", ""),
F("(dovere, tu) ___ chiedere il libretto originale.", "dovresti", "Rada."),
M("Mi ha promesso che ___ il prezzo.", ["avrebbe abbassato", "abbasserebbe", "abbasserà"], 0, "W standardzie: condizionale passato."),
M("Secondo il giornale, il ministro ___ dimesso.", ["si sarebbe", "si è"], 0, "Niepotwierdzona informacja."),
F("Noi (preferire) ___ pagare con un bonifico.", "preferiremmo", "Dwa m."),
F("Che cosa (fare, tu) ___ con un milione di euro?", "faresti", "")]},

{ id: "imperativo", l: "B1", n: "Imperativo", pl: "Tryb rozkazujący",
th: `<table><tr><th></th><th>parlare</th><th>prendere</th><th>finire</th><th>andare</th><th>fare</th></tr>
<tr><td>tu</td><td>parla</td><td>prendi</td><td>finisci</td><td>va'/vai</td><td>fa'/fai</td></tr>
<tr><td>Lei</td><td>parli</td><td>prenda</td><td>finisca</td><td>vada</td><td>faccia</td></tr>
<tr><td>noi</td><td>parliamo</td><td>prendiamo</td><td>finiamo</td><td>andiamo</td><td>facciamo</td></tr>
<tr><td>voi</td><td>parlate</td><td>prendete</td><td>finite</td><td>andate</td><td>fate</td></tr></table>
<p><b>Lei</b> (forma grzecznościowa) = congiuntivo presente: <i>Scusi, mi dica, venga pure.</i> Ważne przy rozmowie ze sprzedawcą!</p>
<p><b>Przeczenie dla „tu”:</b> non + bezokolicznik: <i>Non parlare! Non preoccuparti!</i> Dla innych osób: non + forma: <i>Non parli, non parlate.</i></p>
<p><b>Zaimki</b> przy tu/noi/voi doklejamy na końcu: <i>dimmelo, fallo, prendila, andiamoci</i>. Przy jednosylabowych (di', fa', da', sta', va') podwajamy spółgłoskę: <b>dimmi, fammi, dammi, stammi, vattene</b>. Przy Lei zaimek stoi przed: <i>Me lo dica. Si accomodi.</i></p>
<p>Nieregularne: essere — sii, sia, siamo, siate; avere — abbi, abbia; sapere — sappi.</p>`,
ex: [
F("(dire, tu) ___ la verità! (dosł. Powiedz prawdę!)", "di'|dì", ""),
F("Signore, (venire, Lei) ___ pure!", "venga", ""),
F("Ragazzi, (finire) ___ i compiti!", "finite", ""),
F("Non (preoccuparsi, tu) ___ !", "preoccuparti|ti preoccupare", "Przeczenie dla tu: non + bezokolicznik."),
F("Se hai dubbi, (dire + mi + lo) ___ .", "dimmelo", "Twoje zdanie z notatek."),
F("(fare, tu + mi) ___ vedere il libretto, per favore.", "fammi", "Podwojenie m."),
F("Scusi, (mostrare, Lei + mi) ___ il motore?", "mi mostri", "Przy Lei zaimek przed."),
F("(accomodarsi, Lei) ___ !", "si accomodi", "Proszę usiąść / proszę wejść."),
F("(andare, noi + ci) ___ domani!", "andiamoci", ""),
F("Non (fumare, voi) ___ in macchina!", "fumate", ""),
M("Scusi, ___ il prezzo finale.", ["mi dica", "dimmi", "mi dici"], 0, "Do sprzedawcy per Lei."),
M("„Daj mi kluczyki.” (do kolegi)", ["Dammi le chiavi.", "Dami le chiavi.", "Mi dai le chiavi!"], 0, "da' + mi → dammi."),
M("„Nie martw się!” (do koleżanki)", ["Non ti preoccupare!", "Non preoccupati!", "Non ti preoccupi!"], 0, "Też dobrze: Non preoccuparti!")]},

{ id: "pronomi", l: "B1", n: "Pronomi diretti, indiretti, combinati", pl: "Zaimki dopełnienia",
th: `<table><tr><th></th><th>bezpośrednie (kogo? co?)</th><th>pośrednie (komu?)</th><th>łączone (komu + to)</th></tr>
<tr><td>io</td><td>mi</td><td>mi</td><td><b>me</b> lo/la/li/le/ne</td></tr>
<tr><td>tu</td><td>ti</td><td>ti</td><td><b>te</b> lo…</td></tr>
<tr><td>lui</td><td>lo</td><td>gli</td><td><b>glielo</b>, gliela, glieli, gliele, gliene</td></tr>
<tr><td>lei / Lei</td><td>la / La</td><td>le / Le</td><td><b>glielo</b>… (to samo co lui!)</td></tr>
<tr><td>noi</td><td>ci</td><td>ci</td><td><b>ce</b> lo…</td></tr>
<tr><td>voi</td><td>vi</td><td>vi</td><td><b>ve</b> lo…</td></tr>
<tr><td>loro</td><td>li / le</td><td>gli (loro)</td><td><b>glielo</b>…</td></tr></table>
<p>Zaimek stoi <b>przed czasownikiem</b> (Lo compro), ale <b>dokleja się</b> do bezokolicznika, gerundio i imperativo tu/noi/voi: <i>Voglio comprarlo / Lo voglio comprare; dammelo.</i></p>
<p>W czasach złożonych lo/la/li/le uzgadniają imiesłów: <i>La Panda? L'ho vista.</i></p>`,
ex: [
F("Vedi la Panda? Sì, ___ vedo.", "la", ""),
F("Hai chiamato Marco? Sì, ___ ho chiamato.", "l'|lo", ""),
F("Hai parlato al venditore? Sì, ___ ho parlato.", "gli", "Parlare a qualcuno → pośredni."),
F("Hai scritto a Giulia? Sì, ___ ho scritto.", "le", ""),
F("Mi dai le chiavi? Sì, ___ do.", "te le", ""),
F("Hai dato il libretto al meccanico? Sì, ___ ho dato.", "gliel'|glielo", ""),
F("Ci mostri le foto? Sì, ___ mostro.", "ve le", ""),
F("Il passaporto? Devo portar___ .", "lo", "Doklejamy do bezokolicznika."),
F("Le foto della macchina? Me ___ hai mandate?", "le", ""),
M("Hai comprato le candele? Sì, ___ .", ["le ho comprate", "le ho comprato", "li ho comprati"], 0, "Le + uzgodnienie -e."),
M("Signora, ___ ringrazio.", ["La", "Le", "Lei"], 0, "Ringraziare qualcuno → bezpośredni, forma grzecznościowa La."),
M("Signora, ___ telefono domani.", ["Le", "La", "Gli"], 0, "Telefonare a qualcuno → pośredni Le."),
M("Al venditore? ___ ho già detto.", ["Gliel'", "Lo gli", "Gli l'"], 0, "Gli + lo = glielo → gliel'.")]},

{ id: "cine", l: "B1–B2", n: "Ci e ne", pl: "Partykuły ci i ne",
th: `<p><b>CI</b> = „tam / tu” (miejsce) albo „o tym / w to” po czasownikach z <b>a</b> lub <b>su</b>: <i>Vai a Roma? Sì, <b>ci</b> vado. Credi ai fantasmi? Non <b>ci</b> credo. Ci penso io.</i></p>
<p>Wyrażenia: <b>c'è / ci sono</b> (jest/są), <b>ci vuole / ci vogliono</b> (potrzeba): <i>Ci vogliono due ore.</i> <b>Metterci</b> (komuś zajmuje): <i>Ci metto un'ora.</i> <b>Volerci</b> i <b>metterci</b> to częste pułapki.</p>
<p><b>NE</b> = „tego / z tego / o tym” — ilość lub czasowniki z <b>di/da</b>: <i>Quante Panda hai visto? <b>Ne</b> ho viste tre. Che ne pensi? Ne parliamo domani. Me ne vado</i> (idę sobie).</p>
<p>Połączenia: <b>ce n'è</b> (jest tego), <b>me ne</b>, <b>gliene</b>. Ne w czasach złożonych uzgadnia imiesłów z ilością: <i>Ne ho comprati due.</i></p>`,
ex: [
F("Vai in Italia l'anno prossimo? Sì, ___ vado.", "ci", ""),
F("Quanti chilometri ha? ___ ha centomila.", "ne", ""),
F("Quanto tempo ___ vuole per il passaggio di proprietà?", "ci", "Ci vuole = potrzeba."),
F("Quante foto hai fatto? ___ ho fatte venti.", "ne", ""),
F("Pensi alla Panda? Sì, ___ penso sempre!", "ci", "Pensare a → ci."),
F("Che ___ pensi di questa macchina?", "ne", "Pensare di (opinia) → ne."),
F("Sono stanco, me ___ vado.", "ne", "Andarsene."),
F("Quanto tempo ci (mettere, tu) ___ ad arrivare?", "metti", ""),
M("Per andare a Torino ___ cinque ore.", ["ci vogliono", "ci vuole", "ne vogliono"], 0, "Ci vogliono + l.mn."),
M("Hai dei documenti? Sì, ___ ho alcuni.", ["ne", "ci", "li"], 0, ""),
M("C'è ancora benzina? Sì, ___ un po'.", ["ce n'è", "ci sono", "ne c'è"], 0, ""),
M("Parli del prezzo? Sì, ___ parlo dopo.", ["ne", "ci", "lo"], 0, "Parlare di → ne.")]},

{ id: "relativi", l: "B1–B2", n: "Pronomi relativi", pl: "Zaimki względne",
th: `<p><b>che</b> — który/która/które (podmiot lub dopełnienie, bez przyimka): <i>La macchina <b>che</b> ho visto era rossa.</i></p>
<p><b>cui</b> — po przyimku: <i>il ragazzo <b>con cui</b> parlo, la città <b>in cui</b> vivo, il motivo <b>per cui</b>…</i> Bez przyimka „cui” = „któremu”: <i>la persona (a) cui ho scritto</i>. <b>il cui</b> = którego (dzierżawczy): <i>il venditore <b>la cui</b> Panda è in vendita</i>.</p>
<p><b>il quale / la quale / i quali / le quali</b> — bardziej formalne zamienniki che/cui, jasno pokazują rodzaj: <i>la sorella di Marco, <b>la quale</b> vive a Napoli</i>.</p>
<p><b>chi</b> = ten, kto: <i><b>Chi</b> cerca trova.</i> <b>quello che / ciò che</b> = to, co: <i>Non capisco <b>quello che</b> dici.</i></p>`,
ex: [
F("La Panda ___ ho comprato è del 1986.", "che", ""),
F("Il meccanico di ___ ti ho parlato è bravissimo.", "cui", ""),
F("È la ragione per ___ non sono venuto.", "cui", ""),
F("Non ho capito ___ hai detto.", "quello che|ciò che|quel che", ""),
F("___ trova un buon meccanico è fortunato.", "chi", ""),
F("La città in ___ abito è piccola.", "cui", ""),
M("Il signore ___ macchina è in vendita abita a Bari.", ["la cui", "che la", "di cui la"], 0, "Dzierżawczy: la cui (zgadza się z „macchina”)."),
M("Le persone con ___ lavoro sono simpatiche.", ["cui", "che", "le quali che"], 0, ""),
M("Ho un'amica ___ vive a Roma.", ["che", "cui", "chi"], 0, ""),
M("È il garage ___ ho lasciato la macchina.", ["in cui", "che", "cui"], 0, ""),
F("Ecco i documenti ___ hai bisogno.", "di cui|dei quali", "Avere bisogno di."),
M("„To, czego potrzebuję, to cierpliwość.”", ["Ciò di cui ho bisogno è la pazienza.", "Che ho bisogno è la pazienza."], 0, "")]},

{ id: "cpres", l: "B1", n: "Congiuntivo presente", pl: "Tryb łączący – teraźniejszy",
th: `<p>Congiuntivo to tryb <b>subiektywny</b>: opinia, niepewność, życzenie, emocja. Stoi w zdaniu podrzędnym po <b>che</b>, gdy w głównym jest:</p>
<ul><li><b>opinia:</b> penso che, credo che, mi sembra che, immagino che</li>
<li><b>wola:</b> voglio che, preferisco che, spero che, bisogna che, è necessario che</li>
<li><b>emocja:</b> sono contento che, ho paura che, mi dispiace che</li>
<li><b>niepewność:</b> non so se, dubito che, può darsi che</li>
<li><b>spójniki:</b> benché, sebbene, affinché, perché (= żeby), prima che, a meno che, purché, senza che</li></ul>
<p>Po <b>so che, sono sicuro che, è vero che</b> (pewność) — indicativo!</p>
<table><tr><th></th><th>parlare</th><th>prendere</th><th>finire</th><th>essere</th><th>avere</th></tr>
<tr><td>io/tu/lui</td><td>parli</td><td>prenda</td><td>finisca</td><td>sia</td><td>abbia</td></tr>
<tr><td>noi</td><td>parliamo</td><td>prendiamo</td><td>finiamo</td><td>siamo</td><td>abbiamo</td></tr>
<tr><td>voi</td><td>parliate</td><td>prendiate</td><td>finiate</td><td>siate</td><td>abbiate</td></tr>
<tr><td>loro</td><td>parlino</td><td>prendano</td><td>finiscano</td><td>siano</td><td>abbiano</td></tr></table>
<p>Nieregularne od formy „io” presente: vado → vada, faccio → faccia, dico → dica, vengo → venga, posso → possa. Także: sappia, stia, dia, debba.</p>
<p>Gdy podmiot ten sam — bezokolicznik: <i>Penso <b>di</b> comprarla</i> (nie: penso che io la compri).</p>`,
ex: [
F("Penso che la macchina (essere) ___ in buono stato.", "sia", ""),
F("Spero che il venditore (abbassare) ___ il prezzo.", "abbassi", ""),
F("Voglio che tu mi (dire) ___ la verità.", "dica", ""),
F("Bisogna che noi (controllare) ___ i documenti.", "controlliamo", ""),
F("Benché (piovere) ___ , andiamo a vedere la Panda.", "piova", ""),
F("È importante che Lei (avere) ___ il codice fiscale.", "abbia", ""),
F("Non credo che loro (venire) ___ .", "vengano", ""),
F("Ti presto i soldi purché tu me li (restituire) ___ .", "restituisca", "-isc-"),
F("Dubito che lui (sapere) ___ la risposta.", "sappia", ""),
M("So che la macchina ___ nuova.", ["è", "sia"], 0, "Pewność → indicativo."),
M("Penso ___ la Panda domani.", ["di comprare", "che compri"], 0, "Ten sam podmiot → di + bezokolicznik."),
M("Ho paura che il motore ___ rotto.", ["sia", "è", "sarà"], 0, ""),
F("Prima che tu (partire) ___ , ti do le chiavi.", "parta", "")]},

{ id: "cpass", l: "B1", n: "Congiuntivo passato", pl: "Tryb łączący – przeszły",
th: `<p>Te same zwroty co dla congiuntivo presente, ale czynność w zdaniu podrzędnym <b>już się wydarzyła</b>.</p>
<p>Budowa: <b>congiuntivo presente od avere/essere + imiesłów</b>: <i>abbia comprato, sia partito/a</i>.</p>
<p><i>Penso che Marco <b>abbia</b> già <b>venduto</b> la macchina.</i> — Myślę, że Marco już sprzedał auto.<br><i>Mi dispiace che tu non <b>sia venuto</b>.</i></p>
<p>Porównaj: <i>Penso che <b>parta</b></i> (wyjeżdża teraz/później) — <i>Penso che <b>sia partito</b></i> (już wyjechał).</p>`,
ex: [
F("Penso che il venditore (vendere) ___ già la Panda.", "abbia venduto", ""),
F("Mi dispiace che voi non (venire) ___ .", "siate venuti|siate venute", ""),
F("Credo che lei (partire) ___ ieri.", "sia partita", ""),
F("È possibile che io (sbagliare) ___ strada.", "abbia sbagliato", ""),
F("Sono contento che tu (trovare) ___ la macchina giusta.", "abbia trovato", ""),
F("Non credo che loro (capire) ___ .", "abbiano capito", ""),
F("Spero che il meccanico (controllare) ___ i freni.", "abbia controllato", ""),
M("Benché ___ molto, non sono stanco.", ["abbia lavorato", "ho lavorato", "lavorassi"], 0, ""),
M("Sembra che la macchina ___ un incidente.", ["abbia avuto", "ha avuto", "avesse"], 0, ""),
M("Penso che Marco ___ ieri sera.", ["sia arrivato", "arrivi", "è arrivato"], 0, "Przeszłość + opinia.")]},

{ id: "cimp", l: "B1–B2", n: "Congiuntivo imperfetto e trapassato", pl: "Congiuntivo przeszłe + zgodność czasów",
th: `<p><b>Congiuntivo imperfetto</b>: parla<b>ssi</b>, prende<b>ssi</b>, dormi<b>ssi</b>; fossi, dessi, stessi, facessi, dicessi, bevessi.<br><b>Congiuntivo trapassato</b>: avessi/fossi + imiesłów.</p>
<p><b>Zgodność czasów (concordanza):</b> gdy czasownik główny jest w <b>przeszłości lub w condizionale</b>, w zdaniu z che używamy congiuntivo imperfetto/trapassato:</p>
<table><tr><th>Zdanie główne</th><th>równocześnie</th><th>wcześniej</th></tr>
<tr><td>Penso che… (teraz)</td><td>sia</td><td>sia stato</td></tr>
<tr><td>Pensavo che… (przeszłość)</td><td><b>fosse</b></td><td><b>fosse stato</b></td></tr>
<tr><td>Vorrei che… (condizionale)</td><td><b>venissi</b></td><td>—</td></tr></table>
<p><i>Pensavo che la Panda <b>costasse</b> meno.</i> — Myślałem, że Panda kosztuje mniej. <i>Vorrei che tu <b>venissi</b> con me.</i> — Chciałbym, żebyś pojechał ze mną.</p>
<p>Także po <b>come se</b> (jakby): <i>Parla come se <b>fosse</b> italiano.</i></p>`,
ex: [
F("Pensavo che la macchina (essere) ___ più vecchia.", "fosse", ""),
F("Vorrei che tu (venire) ___ con me in Italia.", "venissi", ""),
F("Non sapevo che il venditore (parlare) ___ inglese.", "parlasse", ""),
F("Credevo che voi (partire) ___ già.", "foste partiti|foste partite", "Wcześniej + przeszłość → trapassato."),
F("Speravo che il prezzo (essere) ___ più basso.", "fosse", ""),
F("Parla come se (sapere) ___ tutto.", "sapesse", ""),
F("Era necessario che noi (portare) ___ il passaporto.", "portassimo", ""),
F("Mi sembrava che lui non (capire) ___ .", "capisse", ""),
F("Avevo paura che qualcuno (comprare) ___ la Panda prima di me.", "avesse comprato|comprasse", ""),
M("Vorrei che il meccanico ___ la macchina.", ["controllasse", "controlli", "controllerebbe"], 0, "Vorrei → cong. imperfetto."),
M("Pensavo che tu ___ ieri.", ["fossi arrivato", "sia arrivato", "arrivassi"], 0, ""),
M("Benché ___ stanco, ha guidato fino a Roma.", ["fosse", "era", "sia"], 0, "Przeszłość → cong. imperfetto."),
F("Mi ha chiesto di aspettare finché non (tornare, lui) ___ .", "fosse tornato|tornasse", "")]},

{ id: "ipotetico", l: "B1–B2", n: "Periodo ipotetico", pl: "Zdania warunkowe",
th: `<table><tr><th>Typ</th><th>Warunek (se +)</th><th>Skutek</th><th>Przykład</th></tr>
<tr><td>I realny</td><td>presente / futuro</td><td>presente / futuro / imperativo</td><td>Se avrai dei dubbi, dimmelo.</td></tr>
<tr><td>II możliwy</td><td>cong. imperfetto</td><td>condizionale presente</td><td>Se avessi l'auto, non userei i mezzi pubblici.</td></tr>
<tr><td>III nierealny</td><td>cong. trapassato</td><td>condizionale passato</td><td>Se mi avessi detto la verità, avrei sofferto meno.</td></tr>
<tr><td>mieszany</td><td>cong. trapassato</td><td>condizionale presente</td><td>Se avessi dormito, ora non sarei stanco.</td></tr></table>
<p><b>Złota zasada:</b> po „se” (= jeśli/gdyby) nigdy condizionale. „Gdybym miał” = <b>se avessi</b>, nie <s>se avrei</s>.</p>
<p>Polski „gdybyś powiedział” może być typem II albo III — decyduje czas: teraz → II, przeszłość → III. Potocznie: <i>Se lo sapevo, non venivo</i> (imperfetto) — w piśmie unikaj.</p>`,
ex: [
F("Se (avere, io) ___ più soldi, comprerei una Panda 4x4.", "avessi", ""),
F("Se domani (piovere) ___ , andiamo in macchina.", "piove", ""),
F("Se mi (dire, tu) ___ la verità, avrei sofferto meno.", "avessi detto", ""),
F("Se la macchina fosse meno arrugginita, la (comprare, io) ___ .", "comprerei", ""),
F("Se (partire, noi) ___ prima, saremmo già arrivati.", "fossimo partiti|fossimo partite", ""),
F("Se avessi controllato l'olio, ora il motore (funzionare) ___ .", "funzionerebbe", "Mieszany."),
F("Se (vedere, tu) ___ Marco, salutalo.", "vedi|vedrai", ""),
F("Cosa faresti se (vincere, tu) ___ alla lotteria?", "vincessi", ""),
M("Se ___ in te, non pagherei così tanto.", ["fossi", "sarei", "fosti"], 0, "Se fossi in te = na twoim miejscu."),
M("Se l'avessi saputo, non ___ .", ["sarei venuto", "verrei", "venissi"], 0, ""),
M("Se ___ tempo, verrei con te.", ["avessi", "avrei", "ho avuto"], 0, ""),
M("Se ___ prima, avremmo trovato posto.", ["fossimo arrivati", "avessimo arrivato", "saremmo arrivati"], 0, "Arrivare + essere."),
F("Se il prezzo (essere) ___ giusto, la compro subito.", "è", "Typ I.")]},

{ id: "gerundio", l: "B1–B2", n: "Gerundio", pl: "Imiesłów przysłówkowy",
th: `<p>Budowa: -are → <b>-ando</b> (parlando), -ere/-ire → <b>-endo</b> (prendendo, dormendo). Nieregularne: facendo, dicendo, bevendo, traducendo, ponendo.</p>
<p><b>stare + gerundio</b> = właśnie coś robić: <i><b>Sto guidando</b>, ti richiamo.</i> — Właśnie prowadzę, oddzwonię. W przeszłości: <i>stavo guidando</i>.</p>
<p><b>Gerundio samodzielnie</b> = „robiąc / ponieważ / jeśli / przez to, że” (ten sam podmiot!): <i><b>Guidando</b> ascolto la radio. <b>Essendo</b> stanco, sono rimasto a casa. <b>Studiando</b> ogni giorno, imparerai.</i></p>
<p><b>Gerundio passato</b> (avendo/essendo + imiesłów) = „zrobiwszy”, czynność wcześniejsza: <i><b>Avendo visto</b> la ruggine, non l'ho comprata.</i></p>
<p>Zaimki doklejamy: <i>guardandola, alzandosi, avendolo visto</i>.</p>`,
ex: [
F("Non posso parlare, (stare + guidare) ___ .", "sto guidando", ""),
F("Quando hai chiamato, (stare, io + mangiare) ___ .", "stavo mangiando", ""),
F("(fare) ___ sport, si sta meglio.", "facendo", ""),
F("(essere) ___ tardi, abbiamo preso un taxi.", "essendo", "Przyczyna."),
F("(avere + finire) ___ il lavoro, sono uscito.", "avendo finito", ""),
F("(controllare + la) ___ bene, ho visto la ruggine.", "controllandola", ""),
F("Che cosa (stare, tu + fare) ___ ?", "stai facendo", ""),
F("(dire) ___ così, mi hai offeso.", "dicendo", ""),
M("___ a Roma, ho visitato il Colosseo.", ["Essendo andato", "Avendo andato", "Andato avendo"], 0, "Andare + essere."),
M("„Ucząc się codziennie, szybko się nauczysz.”", ["Studiando ogni giorno, imparerai presto.", "Studiare ogni giorno, imparerai presto."], 0, ""),
F("(bere) ___ troppo caffè, non riesco a dormire.", "bevendo", "")]},

{ id: "infpass", l: "B1–B2", n: "Infinito passato e participio", pl: "Bezokolicznik przeszły i imiesłów",
th: `<p><b>Infinito passato</b> = avere/essere + imiesłów: <i>aver(e) mangiato, esser(e) partito</i>. Najczęściej po <b>dopo</b>: <i><b>Dopo aver visto</b> la macchina, ho deciso.</i> — Po obejrzeniu auta zdecydowałem. Także: <i>Grazie per avermi aiutato. Mi dispiace di non essere venuto.</i></p>
<p>Pamiętaj: <b>prima di + bezokolicznik</b> (teraźniejszy): <i>Prima di comprare, controlla il motore.</i></p>
<p><b>Participio passato samodzielnie</b> = „po zrobieniu” (formalnie, B2): <i><b>Finito</b> il lavoro, siamo usciti. <b>Arrivati</b> a Torino, abbiamo cercato l'hotel.</i> Uzgadnia się z rzeczownikiem.</p>`,
ex: [
F("Dopo (mangiare) ___ , siamo andati a vedere la Panda.", "aver mangiato|avere mangiato", ""),
F("Dopo (arrivare, noi) ___ a Bologna, abbiamo chiamato il venditore.", "essere arrivati|esser arrivati|essere arrivate", ""),
F("Grazie per (aiutare + mi) ___ .", "avermi aiutato|avermi aiutata", ""),
F("Prima di (firmare) ___ , leggi il contratto.", "firmare", "Prima di + bezokolicznik teraźniejszy."),
F("Mi dispiace di non (venire) ___ alla festa.", "essere venuto|esser venuto|essere venuta", ""),
F("(finire) ___ il controllo, il meccanico ci ha dato il prezzo.", "finito", ""),
F("(arrivare) ___ a casa, Anna ha acceso la luce.", "arrivata", "Uzgodnienie z Anna."),
M("Dopo ___ il contratto, gli ho dato i soldi.", ["aver firmato", "firmato avere", "avendo firmare"], 0, ""),
M("„Po wyjściu z domu zauważyłem, że zapomniałem kluczy.”", ["Dopo essere uscito di casa, mi sono accorto di aver dimenticato le chiavi.", "Dopo uscire di casa, mi sono accorto di dimenticare le chiavi."], 0, ""),
M("___ i documenti, siamo andati all'agenzia.", ["Preparati", "Preparato", "Preparando"], 0, "Uzgodnienie z „i documenti”.")]},

{ id: "passiva", l: "B2", n: "Forma passiva", pl: "Strona bierna",
th: `<p><b>essere + imiesłów</b> (uzgodniony): <i>La Panda <b>è stata prodotta</b> nel 1985.</i> Sprawca z <b>da</b>: <i>…da Fiat</i>.</p>
<p><b>venire + imiesłów</b> — tylko czasy proste, podkreśla czynność: <i>La macchina <b>viene controllata</b> ogni anno.</i></p>
<p><b>andare + imiesłów</b> = musi być zrobione: <i>Il passaggio di proprietà <b>va fatto</b> entro 60 giorni. Questi documenti <b>vanno firmati</b>.</i></p>
<table><tr><th>czynna</th><th>bierna</th></tr>
<tr><td>Fiat produce la Panda.</td><td>La Panda è/viene prodotta da Fiat.</td></tr>
<tr><td>Fiat ha prodotto la Panda.</td><td>La Panda è stata prodotta da Fiat.</td></tr>
<tr><td>Fiat produrrà…</td><td>…sarà/verrà prodotta…</td></tr></table>`,
ex: [
F("La prima Panda (produrre) ___ nel 1980. (passato prossimo, bierna)", "è stata prodotta", ""),
F("La macchina (riparare) ___ ogni anno dal meccanico. (venire, presente)", "viene riparata", ""),
F("Questi documenti (firmare) ___ davanti al notaio. (andare = muszą być)", "vanno firmati", ""),
F("Il contratto (scrivere) ___ dall'avvocato. (passato prossimo)", "è stato scritto", ""),
F("Le chiavi (consegnare) ___ domani. (futuro)", "saranno consegnate|verranno consegnate", ""),
F("La Panda (disegnare) ___ da Giugiaro. (passato prossimo)", "è stata disegnata", "Giorgetto Giugiaro zaprojektował pierwszą Pandę."),
M("Il bollo ___ pagato ogni anno.", ["va", "è stato", "viene stato"], 0, "Andare = musi być."),
M("Questa macchina ___ venduta ieri.", ["è stata", "viene", "va"], 0, "Venire tylko w czasach prostych."),
M("„Auto zostało sprawdzone przez mechanika.”", ["La macchina è stata controllata dal meccanico.", "La macchina ha stato controllato dal meccanico."], 0, ""),
F("Molte Panda (esportare) ___ in Polonia. (presente, essere)", "sono esportate", "")]},

{ id: "si", l: "B1–B2", n: "Si impersonale e passivante", pl: "Forma bezosobowa „si”",
th: `<p><b>Si impersonale</b> = „się” / „ludzie”: <i>In Italia <b>si mangia</b> bene. <b>Si dice</b> che… Come <b>si dice</b> „korkociąg”?</i></p>
<p><b>Si passivante</b> — z rzeczownikiem czasownik zgadza się z nim w liczbie: <i><b>Si vende</b> Panda 4x4. <b>Si vendono</b> Panda d'epoca. Qui <b>si parlano</b> tre lingue.</i></p>
<p>Z czasownikiem zwrotnym: <b>ci si</b>: <i>Ci si alza presto.</i> Z przymiotnikiem — l.mn.: <i>Si è stanchi dopo il viaggio.</i></p>
<p>W czasach złożonych zawsze <b>essere</b>: <i>Si è mangiato bene. Si sono vendute molte macchine.</i></p>`,
ex: [
F("In Italia (si + guidare) ___ a destra.", "si guida", ""),
F("Qui (si + vendere) ___ macchine usate.", "si vendono", "L.mn. — zgadza się z „macchine”."),
F("Come (si + dire) ___ „przegląd” in italiano? — La revisione.", "si dice", ""),
F("In questo garage (si + riparare) ___ auto d'epoca.", "si riparano", ""),
F("Dopo un lungo viaggio (si + essere) ___ stanchi.", "si è", ""),
F("La domenica (alzarsi, bezosobowo) ___ tardi.", "ci si alza", ""),
M("___ un appartamento in centro. (ogłoszenie)", ["Affittasi", "Si affittano", "Affitta"], 0, "W ogłoszeniach: vendesi, affittasi (= si vende, si affitta)."),
M("Ieri sera ___ bene in quel ristorante.", ["si è mangiato", "si ha mangiato", "si mangiava"], 0, ""),
M("In Polonia ___ molte Fiat.", ["si vedono", "si vede", "si vedevano"], 0, ""),
F("„Sprzedam Fiat Panda” w ogłoszeniu: ___ Fiat Panda.", "vendesi|si vende", "")]},

{ id: "indiretto", l: "B2", n: "Discorso indiretto", pl: "Mowa zależna",
th: `<p>Gdy czasownik wprowadzający jest w <b>przeszłości</b> (ha detto, diceva, disse), czasy się przesuwają:</p>
<table><tr><th>Mowa niezależna</th><th>Mowa zależna (ha detto che…)</th></tr>
<tr><td>presente: „Sono stanco.”</td><td>imperfetto: era stanco</td></tr>
<tr><td>passato prossimo: „Ho venduto la macchina.”</td><td>trapassato: aveva venduto</td></tr>
<tr><td>futuro: „Verrò domani.”</td><td><b>condizionale passato</b>: sarebbe venuto</td></tr>
<tr><td>imperativo: „Chiamami!”</td><td>di + bezokolicznik: mi ha detto di chiamarlo</td></tr>
<tr><td>cong. presente: „Penso che sia caro.”</td><td>cong. imperfetto: pensava che fosse caro</td></tr></table>
<p>Zmieniają się też wyrazy: oggi → quel giorno, domani → il giorno dopo, ieri → il giorno prima, qui → lì, questo → quello, io → lui/lei.</p>
<p>Pytania: <i>„Quanto costa?” → Mi ha chiesto quanto costasse/costava.</i></p>`,
ex: [
F("„Sono stanco.” → Marco ha detto che (essere) ___ stanco.", "era", ""),
F("„Ho venduto la Panda.” → Ha detto che (vendere) ___ la Panda.", "aveva venduto", ""),
F("„Verrò domani.” → Ha detto che (venire) ___ il giorno dopo.", "sarebbe venuto", ""),
F("„Chiamami!” → Mi ha detto di (chiamare + lo) ___ .", "chiamarlo", ""),
F("„La macchina è perfetta.” → Il venditore diceva che la macchina (essere) ___ perfetta.", "era", ""),
F("„Pagherò con un bonifico.” → Ho detto che (pagare) ___ con un bonifico.", "avrei pagato", ""),
M("„Domani vengo qui.” → Ha detto che ___ .", ["sarebbe venuto lì il giorno dopo", "viene qui domani", "venisse qui domani"], 0, ""),
M("„Quanto costa?” → Gli ho chiesto quanto ___ .", ["costasse", "costerebbe", "è costato"], 0, "W pytaniu zależnym często congiuntivo (lub imperfetto potocznie)."),
M("„Non toccare il motore!” → Mi ha detto ___ .", ["di non toccare il motore", "che non tocco il motore", "non toccare il motore"], 0, ""),
F("„Ieri ho visto tre Panda.” → Ha detto che il giorno prima (vedere) ___ tre Panda.", "aveva visto|aveva veduto", "")]},

{ id: "remoto", l: "B2", n: "Passato remoto", pl: "Czas przeszły dokonany (literacki)",
th: `<p>Czas przeszły do <b>dawnych, zamkniętych wydarzeń</b>: historia, biografie, książki, opowieści. Na północy Włoch w mowie prawie nieużywany, na południu (Sycylia, Neapol) — także na co dzień. Na B2 trzeba go <b>rozpoznawać</b>.</p>
<table><tr><th></th><th>parlare</th><th>credere</th><th>dormire</th><th>essere</th><th>avere</th></tr>
<tr><td>io</td><td>parlai</td><td>credei/credetti</td><td>dormii</td><td>fui</td><td>ebbi</td></tr>
<tr><td>tu</td><td>parlasti</td><td>credesti</td><td>dormisti</td><td>fosti</td><td>avesti</td></tr>
<tr><td>lui</td><td>parlò</td><td>credé/credette</td><td>dormì</td><td>fu</td><td>ebbe</td></tr>
<tr><td>noi</td><td>parlammo</td><td>credemmo</td><td>dormimmo</td><td>fummo</td><td>avemmo</td></tr>
<tr><td>voi</td><td>parlaste</td><td>credeste</td><td>dormiste</td><td>foste</td><td>aveste</td></tr>
<tr><td>loro</td><td>parlarono</td><td>crederono</td><td>dormirono</td><td>furono</td><td>ebbero</td></tr></table>
<p><b>Nieregularne 1-3-6:</b> nieregularne są tylko formy io, lui, loro: prendere → <b>presi</b>, prendesti, <b>prese</b>, prendemmo, prendeste, <b>presero</b>. Tak samo: misi, scrissi, lessi, vidi, venni, volli, seppi, conobbi, nacqui, vissi, chiesi, risposi, decisi.</p>
<p>Pełne nieregularne: feci/facesti, dissi/dicesti, diedi/desti, stetti/stesti, bevvi/bevesti.</p>`,
ex: [
F("La prima Panda (nascere) ___ nel 1980.", "nacque", ""),
F("Giugiaro (disegnare) ___ la Panda in pochi mesi.", "disegnò", ""),
F("Dante (scrivere) ___ la Divina Commedia.", "scrisse", ""),
F("I Romani (costruire) ___ molte strade.", "costruirono", ""),
F("Garibaldi (essere) ___ un eroe.", "fu", ""),
F("Mio nonno (vivere) ___ a Napoli tutta la vita.", "visse", ""),
F("Quando lo (vedere, io) ___ , capii tutto.", "vidi", ""),
M("„ebbero” to forma czasownika:", ["avere", "essere", "andare"], 0, ""),
M("„fecero” to forma czasownika:", ["fare", "fermare", "ferire"], 0, ""),
M("„nacque” = ", ["urodził się", "urodzi się", "rodził się"], 0, ""),
M("„decise” = ", ["zdecydował", "zdecydowałby", "zdecyduje"], 0, ""),
M("„venne” to forma czasownika:", ["venire", "vendere", "vedere"], 0, ""),
F("Noi (andare) ___ a Roma nel 1990.", "andammo", "")]},

{ id: "connettivi", l: "B2", n: "Connettivi", pl: "Spójniki i łączniki",
th: `<table><tr><th>Znaczenie</th><th>+ indicativo</th><th>+ congiuntivo</th></tr>
<tr><td>przyczyna</td><td>perché, siccome, dato che, poiché</td><td>—</td></tr>
<tr><td>przyzwolenie (chociaż)</td><td>anche se</td><td><b>benché, sebbene, nonostante, malgrado</b></td></tr>
<tr><td>warunek</td><td>se</td><td><b>purché</b> (pod warunkiem że), <b>a meno che (non)</b> (chyba że), <b>nel caso in cui</b></td></tr>
<tr><td>cel</td><td>—</td><td><b>affinché, perché</b> (= żeby)</td></tr>

async function enrich(ids, out) {
  if (!SAMPLE) return;
  const list = ids.map(id => S.words[id]).filter(Boolean);
  for (let i = 0; i < list.length; i += 20) {
    const batch = list.slice(i, i + 20);
    if (out) out.textContent = "Claude uzupełnia słówka " + (i + 1) + "–" + (i + batch.length) + " z " + list.length + "…";
    const prompt = "You help a Polish learner of Italian (level B1–B2). For each entry below (Italian word or phrase as the learner wrote it, and a Polish meaning that may be empty, \"?\" or wrong) return an object, in the same order, with these fields:\n"
      + "\"it\": the Italian headword written correctly (fix spelling mistakes; nouns with the definite article, e.g. \"il quaderno\"; adjectives as \"orgoglioso / orgogliosa\"; verbs in the infinitive; keep phrases as phrases),\n"
      + "\"pl\": a short Polish meaning (fill it if missing, correct it if clearly wrong),\n\"type\": one of \"n\",\"v\",\"adj\",\"adv\",\"expr\",\"other\",\n"
      + "\"ex\": one short natural Italian example sentence (B1) that contains the word, \"exPl\": its Polish translation,\n"
      + "\"note\": a very short Polish note only if useful (irregular plural, gender trap, false friend, or what was corrected), otherwise \"\",\n"
      + "\"isc\": true only for -ire verbs conjugated with -isc-, otherwise false, \"aux\": \"e\" or \"a\" for verbs (auxiliary in passato prossimo), otherwise \"\".\n"
      + "Entries: " + JSON.stringify(batch.map(w => ({ it: w.it, pl: w.pl || "" }))) + "\nReturn only a JSON array with exactly " + batch.length + " objects.";
    try {
      const r = await SAMPLE.json(prompt, { modelTier: "default" });
      if (!Array.isArray(r)) continue;
      batch.forEach((w, k) => {
        const x = r[k]; if (!x || typeof x !== "object") return;
        const nw = Object.assign({}, w);
        if (x.it && String(x.it).length < 80) { if (norm(x.it) !== norm(w.it)) nw.orig = w.it; nw.it = String(x.it); }
        if (x.pl) nw.pl = String(x.pl);
        ["type", "ex", "exPl"].forEach(f => { if (x[f]) nw[f] = String(x[f]); });
        if (x.note) nw.note = [w.note, String(x.note)].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(" ");
        if (nw.type === "v") { nw.isc = !!x.isc; if (x.aux === "e" || x.aux === "a") nw.aux = x.aux; }
        nw.ai = 1; saveWord(nw);
      });
    } catch (e) {
      if (out) out.textContent = e && e.code === "not_granted" ? "Dostęp do Claude jest wyłączony." : e && e.code === "rate_limited" ? "Za dużo zapytań — spróbuj za chwilę." : "Nie udało się uzupełnić części słówek.";
      return;
    }
  }
  if (out) out.textContent = "Gotowe — uzupełniono " + SL(list.length) + ".";
}

const canvasBlob = (c, q) => new Promise(r => c.toBlob(r, "image/jpeg", q || 0.85));
async function fileToImages(file, out) {
  const imgs = [];
  if (/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)) {
    out.textContent = "Otwieram PDF…";
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const n = Math.min(pdf.numPages, 8);
    for (let p = 1; p <= n; p++) {
      out.textContent = "Czytam stronę " + p + " z " + n + "…";
      const page = await pdf.getPage(p);
      const vp0 = page.getViewport({ scale: 1 }); const sc = Math.min(2, 1400 / vp0.width);
      const vp = page.getViewport({ scale: sc });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      imgs.push(await canvasBlob(c));
    }
  } else {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    imgs.push(await canvasBlob(c));
  }
  return imgs;
}

  if (userText != null) { CHAT.log.push({ me: 1, text: userText }); msgs.push({ role: "user", content: userText }); }
  CHAT.busy = true; rerender();
  try {
    const r = await SAMPLE.json(msgs, { modelTier: "default", cache: false });
    if (r && r.it) { if (userText != null && r.fix) CHAT.log[CHAT.log.length - 1].fix = String(r.fix); CHAT.log.push({ it: String(r.it), pl: String(r.pl || "") }); }
  } catch (e) { CHAT.err = e && e.code === "rate_limited" ? "Za dużo wiadomości — odczekaj chwilę." : "Nie udało się połączyć z Claude."; }
  CHAT.busy = false; rerender();
  if (CHAT && CHAT.err) { const o = $("#cout"); if (o) o.textContent = CHAT.err; CHAT.err = null; }
  const last = CHAT && CHAT.log[CHAT.log.length - 1]; if (last && !last.me && canSpeak() && S.misc.autoSay) speak(last.it);
}
function vPostep() {
  const ws = allWords(); const seen = ws.filter(w => srsGet(w.ref));
  const boxes = [0, 0, 0, 0, 0, 0, 0, 0, 0]; seen.forEach(w => boxes[srsGet(w.ref).b]++);
  const lbl = ["nowe/błędne", "1 dzień", "2 dni", "4 dni", "tydzień", "2 tygodnie", "miesiąc", "2 miesiące", "4 miesiące"];
  const mx = Math.max(1, ...boxes);
  let h = "<h1>Postęp</h1><p>Twoich słówek: <b>" + userWords().length + "</b> · wszystkich w aplikacji: <b>" + ws.length + "</b> · już ćwiczonych: <b>" + seen.length + "</b> · do powtórki teraz: <b>" + dueWords().length + "</b></p>";
  h += "<h2>Jak dobrze znasz słówka</h2><p class=small>Im dalej w prawo, tym rzadziej słówko wraca — znaczy, że je umiesz.</p><table>" + boxes.map((b, i) => "<tr><td style='white-space:nowrap'>" + lbl[i] + "</td><td style='width:60%'><div style='height:18px;border:2px solid var(--line);width:" + Math.max(2, 100 * b / mx) + "%;background:var(--ink)'></div></td><td style='text-align:right'>" + b + "</td></tr>").join("") + "</table>";
  h += "<h2>Gramatyka</h2><table><tr><th>Temat</th><th style='text-align:right'>zrobione</th><th style='text-align:right'>dobrze</th></tr>" + G.map(t => { const s = topicScore(t); return "<tr><td><a href='#g-" + t.id + "'>" + esc(t.n) + "</a></td><td style='text-align:right'>" + s.done + "/" + s.total + "</td><td style='text-align:right'>" + (s.done ? Math.round(100 * s.ok / s.done) + "%" : "–") + "</td></tr>"; }).join("") + "</table>";
  h += "<h2>Ustawienia</h2><div class=fields><div class=fld><label for=npd>Nowych słówek dziennie</label><select id=npd>" + [5, 10, 15, 20, 30, 50].map(n => "<option" + (S.misc.newPerDay === n ? " selected" : "") + ">" + n + "</option>").join("") + "</select></div><div class=fld><label for=goal>Cel punktów na dzień</label><select id=goal>" + [50, 100, 150, 200, 300].map(n => "<option" + (S.misc.goal === n ? " selected" : "") + ">" + n + "</option>").join("") + "</select></div></div>"
    + "<div class=chips><label class='chk" + (S.misc.eink ? " on" : "") + "'><input type=checkbox id=eink" + (S.misc.eink ? " checked" : "") + ">Tryb e-ink (bez animacji)</label>" + (canSpeak() ? "<label class='chk" + (S.misc.autoSay ? " on" : "") + "'><input type=checkbox id=autosay" + (S.misc.autoSay ? " checked" : "") + ">Czytaj na głos odpowiedzi sprzedawcy</label>" : "") + "</div>";
  h += "<h2>Synchronizacja i kopia</h2>";
  if (OFFLINE) {
    h += "<div class=box><h3>Automatycznie przez GitHub (darmowe)</h3>"
      + (GIST.token ? "<p>Połączono. Postęp zapisuje się w Twoim prywatnym gist’cie na GitHubie i scala z innymi urządzeniami — przy otwarciu aplikacji, po każdym treningu i przy zamknięciu.</p><p class=mut id=gmsg>" + esc(gistMsg) + "</p><div class=row><button class='btn pri' data-act=gistnow" + (gistBusy ? " disabled" : "") + ">Synchronizuj teraz</button><button class=btn data-act=gistoff>Odłącz</button></div><label class='chk" + (GIST.auto !== false ? " on" : "") + "'><input type=checkbox id=gauto" + (GIST.auto !== false ? " checked" : "") + ">Synchronizuj automatycznie</label>"
        : "<p class=small>Jednorazowo na każdym urządzeniu: 1) zaloguj się na github.com (darmowe konto), 2) otwórz <b>github.com/settings/tokens/new?scopes=gist&amp;description=wloski</b>, ustaw „Expiration” na „No expiration”, kliknij „Generate token”, 3) skopiuj token i wklej poniżej. Na drugim urządzeniu wklej ten sam token — aplikacja sama znajdzie Twoje dane.</p><p class=small>Token daje dostęp tylko do Twoich gistów. Zostaje w tym urządzeniu i nie trafia do kopii zapasowej.</p><div class=fld><label for=gtok>Token GitHub</label><input id=gtok type=password autocomplete=off autocapitalize=off></div><div class=row><button class='btn pri' data-act=gistsave>Połącz i synchronizuj</button></div><p class=mut id=gmsg>" + esc(gistMsg) + "</p>")
      + "</div>";
  } else {
    h += "<p class=small>" + (DB ? "Tutaj dane zapisują się na Twoim koncie Claude i synchronizują między urządzeniami. " : "") + "Do wersji offline (telefon bez Claude) przenosisz postęp plikiem: zapisz go tutaj i wczytaj tam — albo odwrotnie. Wyniki się scalają, nic nie ginie.</p>";
  }
  h += "<div class=box><h3>Plik postępu</h3><p class=small>Zawiera słówka, powtórki, wyniki, punkty i ustawienia. Wczytanie pliku scala dane: wygrywa nowsza zmiana.</p><div class=row><button class='btn pri' data-act=dlfile>Zapisz plik postępu</button><button class=btn data-act=backup>Kopiuj jako tekst</button></div>"
    + "<div class=fld><label for=pfile>Wczytaj plik postępu</label><input id=pfile type=file accept='.json,application/json,text/plain'></div>"
    + "<details><summary>Wklej postęp jako tekst</summary><div class=fld><textarea id=restore style='min-height:80px'></textarea></div><div class=row><button class=btn data-act=restore>Wczytaj</button></div></details>" + outP("bout") + "</div>";
  return h;
}

function importText(txt) {
  const o = outEl("bout");
  try {
    const x = JSON.parse(txt); if (!x || x.app !== "wloski") throw 0;
    const r = mergeInto(x, !!DB);
    o.textContent = "Wczytano. Nowe lub nowsze: " + SL(r.nw) + (r.nr ? ", " + r.nr + " wyników" : "") + (r.nd ? ", usunięte: " + SL(r.nd) : "") + ".";
    toast("Postęp scalony."); dirty(); setStatus(); rerender();
  } catch (e) { o.textContent = "To nie jest plik postępu z tej aplikacji."; }
}
async function downloadProgress() {
  const txt = exportJSON(); const name = "wloski-postep-" + dayKey() + ".json"; const o = outEl("bout");
  if (OFFLINE) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); if (o) o.textContent = "Plik zapisany: " + name; return; }
  if (DL) { try { await DL.save({ filename: name, data: txt }); if (o) o.textContent = "Plik zapisany: " + name; return; } catch (e) { if (e && e.code === "declined") { if (o) o.textContent = "Anulowano."; return; } } }
  try { await navigator.clipboard.writeText(txt); if (o) o.textContent = "Nie mogę zapisać pliku w tym widoku — skopiowałem postęp do schowka. Wklej go w wersji offline w polu „Wklej postęp jako tekst”."; } catch (e) { $("#restore").value = txt; if (o) o.textContent = "Skopiuj tekst z pola poniżej."; }
}

/* ====== router ====== */
function rerender() {
  const h = location.hash.slice(1) || "start";
  if (h === "trening") return;
  const v = $("#view"); const y = window.scrollY;
  const act = document.activeElement && document.activeElement.id;
  const keep = {}; v.querySelectorAll("textarea[id],input[id]:not([type=checkbox]):not([type=file])").forEach(x => keep[x.id] = x.value);
  route(true);
  for (const id in keep) { const x = document.getElementById(id); if (x && !x.value) x.value = keep[id]; }
  window.scrollTo(0, y);
  if (act) { const x = document.getElementById(act); if (x) x.focus({ preventScroll: true }); }
}
function route(soft) {
  const h = location.hash.slice(1) || "start";
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === h || (h.startsWith("g-") && a.dataset.v === "gramatyka") || (h === "slowka-gotowe" && a.dataset.v === "slowka")));
  const v = $("#view");
  GEN.setExtra(myVerbs());
  if (h === "trening") { renderSession(); }
  else if (h === "slowka" || h === "slowka-gotowe") { v.innerHTML = vSlowka(); if (h === "slowka-gotowe" && !soft) setTimeout(() => { const g = document.getElementById("gotowe"); if (g) g.scrollIntoView(); }, 0); }
  else if (h === "gramatyka") v.innerHTML = vGram();
  else if (h.startsWith("g-")) v.innerHTML = vTopic(h.slice(2));
  else if (h === "odmiana") v.innerHTML = vOdmiana();
  else if (h === "panda") v.innerHTML = vPanda();
  else if (h === "postep") v.innerHTML = vPostep();
  else if (h === "gry") v.innerHTML = vGry();
  else v.innerHTML = vStart();
  setStatus();
  if (!soft) window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => { for (const k in OUT) delete OUT[k]; route(false); });

/* ====== akcje ====== */
function seedNotes() { (window.SEED || []).forEach(w => { if (!S.words[w.id]) saveWord(Object.assign({}, w)); }); toast("Wczytano słówka z notatek 18.11.2026."); rerender(); }
function oldestTopic() { const sc = G.map(t => { const s = topicScore(t); return [t, s.done / Math.max(1, s.total) + (s.done ? (s.wrong / s.done) * -0.5 : 0) + Math.random() * 0.15]; }); sc.sort((a, b) => a[1] - b[1]); return sc[0][0]; }
document.addEventListener("click", ev => {
  if (location.hash === "#trening") return;
  const t = ev.target.closest("button"); if (!t) return;
  const a = t.dataset.act;
  if (a === "seed") return seedNotes();
  if (a === "spin") return spin();
  if (t.dataset.wplay) return playWheel(+t.dataset.wplay);
  if (a === "sprint") return startSession("Sprint 60 s", GEN.many(mixGen(), 12), location.hash || "#gry", null, { sprint: 60, more: n => GEN.many(mixGen(), n) });
  if (a === "dice") return startSession("Kości: odmiana", GEN.many(() => GEN.dice(S.misc.tenses), 6), location.hash || "#gry", null, { more: n => GEN.many(() => GEN.dice(S.misc.tenses), n) });
  if (t.dataset.genplay) { const k = t.dataset.genplay; const fn = k === "mix" ? mixGen() : GEN.GENS[k].f; return startSession(k === "mix" ? "Mieszanka" : GEN.GENS[k].n, GEN.many(fn, 15), "#gry"); }
  if (a === "dlfile") return downloadProgress();
  if (a === "gistsave") { const tk = ($("#gtok").value || "").trim(); if (!tk) return toast("Wklej token."); GIST = { token: tk, auto: true }; saveGist(); gistSync(false); return; }
  if (a === "gistnow") { gistSync(false); return; }
  if (a === "gistoff") { GIST = {}; saveGist(); gistMsg = ""; setStatus(); rerender(); return; }
  if (a === "srs") { const ud = decks().filter(d => d.user).map(d => d.id); const dueAll = dueWords().map(w => w.deck); const ds = [...new Set(ud.concat(dueAll))]; return startSession("Powtórka słówek", buildVocab(ds.length ? ds : ["b:verbs"], "srs", 30), "#start", "Na dziś wszystko powtórzone. Nowe słówka wrócą jutro."); }
  if (a === "mixg") { const tp = oldestTopic(); return startSession(tp.n, topicItems(tp).slice(0, 15), "#g-" + tp.id); }
  if (a === "conj") return startSession("Odmiana", buildConj(15, "all"), "#odmiana");
  if (a === "conjgo") return startSession("Odmiana", buildConj(+$("#cn").value, $("#csrc").value), "#odmiana");
  if (a === "table") { TBL = norm($("#tverb").value); rerender(); return; }
  if (t.dataset.train) { const id = t.dataset.train; const ds = selDecks(id); if (!ds.length) return toast("Zaznacz przynajmniej jeden zestaw."); const m = $("#" + id + "-m").value; return startSession(m === "srs" ? "Fiszki" : "Trening słówek", buildVocab(ds, m, +$("#" + id + "-n").value), location.hash || "#slowka"); }
  if (t.dataset.fl) return startSession("Fiszki: " + (decks().find(d => d.id === t.dataset.fl) || { n: "" }).n, buildVocab([t.dataset.fl], "srs", 20), location.hash, "Na dziś wszystko z tego zestawu powtórzone.");
  if (t.dataset.quick) return startSession("Trening: " + (decks().find(d => d.id === t.dataset.quick) || { n: "" }).n, buildVocab([t.dataset.quick], "mix", 20), location.hash);
  if (t.dataset.topic) { const tp = G.find(x => x.id === t.dataset.topic); return startSession(tp.n, topicItems(tp), "#g-" + tp.id); }
  if (t.dataset.topicw) { const tp = G.find(x => x.id === t.dataset.topicw); return startSession(tp.n + " — błędne", topicItems(tp, true), "#g-" + tp.id); }
  if (t.dataset.gen) { t.disabled = true; const tp = G.find(x => x.id === t.dataset.gen); genExercises(tp, 10, $("#gw") && $("#gw").checked, outEl("gout")).then(() => { t.disabled = false; }); return; }
  if (t.dataset.tab) { addTab = t.dataset.tab; rerender(); return; }
  if (a === "parse") { PASTE = parsePaste($("#paste").value); if (!PASTE.length) toast("Nie widzę żadnych słówek."); rerender(); return; }
  if (t.dataset.import) {
    const src = t.dataset.import; const list = src === "paste" ? PASTE : IMPORT.words;
    const deck = (($("#" + (src === "paste" ? "pdeck" : "ndeck")) || {}).value || "Moje słówka").trim() || "Moje słówka";
    const ids = [];
    list.forEach((x, i) => { if (!x.on || !x.it.trim()) return; const w = { id: uid() + i, it: x.it.trim(), pl: x.pl.trim(), deck, t: now() + i }; if (V.isVerb(bare(w.it))) w.type = "v"; saveWord(w); ids.push(w.id); });
    const ai = $("#" + src + "-ai");
    if (src === "paste") { PASTE = null; $("#paste").value = ""; } else IMPORT = null;
    toast("Zapisano " + SL(ids.length) + " w zestawie „" + deck + "”.");
    FILTER = "u:" + deck;
    if (ai && ai.checked && SAMPLE) { rerender(); enrich(ids, outEl("eout")).then(rerender); }
    else rerender();
    return;
  }
  if (a === "readnotes") { const f = $("#nfile"); if (!f.files.length) return toast("Wybierz plik."); t.disabled = true; readNotes([...f.files], outEl("nout")).then(() => { t.disabled = false; }); return; }
  if (a === "addone") {
    const it = $("#oit").value.trim(); if (!it) return toast("Wpisz słówko po włosku.");
    const w = { id: uid(), it, pl: $("#opl").value.trim(), deck: $("#odeck").value.trim() || "Moje słówka", t: now() }; if (V.isVerb(bare(it))) w.type = "v";
    saveWord(w); $("#oit").value = ""; $("#opl").value = ""; toast("Dodano: " + it);
    if (SAMPLE) enrich([w.id], null).then(rerender); else rerender();
    return;
  }
  if (a === "enrichall") { t.disabled = true; enrich(Object.values(S.words).filter(w => !w.ai).map(w => w.id), outEl("eout")).then(() => { t.disabled = false; rerender(); }); return; }
  if (t.dataset.edit) { EDIT = t.dataset.edit; FILTER = "u:" + (S.words[EDIT].deck || "Moje słówka"); rerender(); return; }
  if (t.hasAttribute("data-cancel")) { EDIT = null; rerender(); return; }
  if (t.dataset.save) {
    const w = Object.assign({}, S.words[t.dataset.save]);
    w.it = $("#e-it").value.trim() || w.it; w.pl = $("#e-pl").value.trim(); w.ex = $("#e-ex").value.trim(); w.exPl = $("#e-expl").value.trim(); w.note = $("#e-note").value.trim(); w.deck = $("#e-deck").value.trim() || "Moje słówka";
    if ($("#e-isc")) w.isc = $("#e-isc").checked; if ($("#e-aux")) w.aux = $("#e-aux").checked ? "e" : "a";
    if (V.isVerb(bare(w.it)) && !w.type) w.type = "v";
    saveWord(w); EDIT = null; FILTER = "u:" + w.deck; rerender(); return;
  }
  if (t.dataset.del) { const w = S.words[t.dataset.del]; if (t.dataset.sure) { delWord(w.id); EDIT = null; toast("Usunięto: " + w.it); rerender(); } else { t.dataset.sure = 1; t.textContent = "Na pewno usunąć?"; } return; }
  if (t.dataset.scen) { CHAT = { id: t.dataset.scen, log: [] }; chatTurn(null); return; }
  if (a === "chatsend") { const v = $("#cin").value.trim(); if (!v || CHAT.busy) return; $("#cin").value = ""; chatTurn(v); return; }
  if (a === "chatend") { CHAT = null; rerender(); return; }
  if (t.dataset.sayt) { speak(t.dataset.sayt); return; }
  if (a === "backup") { const txt = exportJSON(); const o = outEl("bout"); try { navigator.clipboard.writeText(txt).then(() => { o.textContent = "Skopiowano (" + Math.round(txt.length / 1024) + " kB). Wklej to np. do notatki."; }, () => { $("#restore").value = txt; o.textContent = "Nie mogę użyć schowka — kopia jest w polu poniżej, zaznacz i skopiuj."; }); } catch (e) { $("#restore").value = txt; } return; }
  if (a === "restore") { importText($("#restore").value); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.matches("label.chk input[type=checkbox]")) t.closest("label").classList.toggle("on", t.checked);
  if (t.dataset.tense) setMisc("tenses", [...document.querySelectorAll("[data-tense]:checked")].map(x => x.dataset.tense));
  if (t.id === "eink") { setMisc("eink", t.checked); }
  if (t.id === "goal") { setMisc("goal", +t.value); }
  if (t.id === "pfile" && t.files && t.files[0]) { t.files[0].text().then(importText).catch(() => toast("Nie mogę odczytać pliku.")); t.value = ""; }
  if (t.id === "gauto") { GIST.auto = t.checked; saveGist(); }
  if (t.dataset.step) { S.misc.steps[t.dataset.step] = t.checked; saveState("misc"); }
  if (t.id === "npd") setMisc("newPerDay", +t.value);
  if (t.id === "autosay") setMisc("autoSay", t.checked);
  const imp = t.dataset.impOn; if (imp) { const [src, i] = imp.split(":"); (src === "paste" ? PASTE : IMPORT.words)[+i].on = t.checked; }
});
document.addEventListener("input", ev => {
  const t = ev.target; const a = t.dataset.impIt || t.dataset.impPl; if (!a) return;
  const [src, i] = a.split(":"); const row = (src === "paste" ? PASTE : IMPORT.words)[+i]; if (row) row[t.dataset.impIt ? "it" : "pl"] = t.value;
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.id === "tverb") { TBL = norm(ev.target.value); rerender(); } if (ev.key === "Enter" && (ev.target.id === "oit" || ev.target.id === "opl")) { const b = document.querySelector("[data-act=addone]"); if (b) b.click(); } });

route(false);
initCaps();
}
